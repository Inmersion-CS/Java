name: Feature request
description: Propose a Java learning or product improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: learner-need
    attributes:
      label: Learner need
      description: What learning problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful version.
    validations:
      required: true
